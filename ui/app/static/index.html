<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>声音工坊 · GPT-SoVITS</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --text:#e8ecf1; --dim:#9aa4b2; --accent:#5b8cff; --accent2:#7c5cff;
    --ok:#3ecf8e; --warn:#ffb454; --err:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  a{color:var(--accent);text-decoration:none}
  header{display:flex;align-items:center;gap:14px;padding:14px 20px;
         border-bottom:1px solid var(--line);background:linear-gradient(90deg,#171a21,#12151b)}
  header h1{font-size:17px;margin:0;letter-spacing:.5px}
  header .sub{color:var(--dim);font-size:12px}
  .pill{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:20px;
        border:1px solid var(--line);background:var(--panel2);color:var(--dim)}
  .pill.ok{color:var(--ok);border-color:#245} .pill.warn{color:var(--warn)}
  .wrap{display:grid;grid-template-columns:330px 1fr;gap:16px;padding:16px 20px 40px;max-width:1400px;margin:0 auto}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--dim);font-weight:600;letter-spacing:.4px}
  label{display:block;font-size:12px;color:var(--dim);margin:8px 0 4px}
  select,input[type=text],textarea{width:100%;background:var(--panel2);color:var(--text);
      border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;outline:none}
  select:focus,input:focus,textarea:focus{border-color:var(--accent)}
  textarea{min-height:130px;resize:vertical;line-height:1.7}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--line);
         border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));border:none;font-weight:600}
  button.primary:disabled{opacity:.5;cursor:not-allowed}
  button.tiny{padding:3px 8px;font-size:12px}
  audio{width:100%;margin-top:8px}
  .row{display:flex;gap:8px;align-items:center}
  .row>*{flex:1}
  .muted{color:var(--dim);font-size:12px}
  .file{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);
        border-radius:8px;background:var(--panel2);margin-bottom:8px}
  .file .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
  .log{font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--dim);white-space:pre-wrap;
       background:#12151b;border:1px solid var(--line);border-radius:8px;padding:8px;max-height:150px;overflow:auto}
  .status{margin-top:8px;font-size:13px}
  .status.run{color:var(--warn)} .status.done{color:var(--ok)} .status.err{color:var(--err)}
  .bar{height:6px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:8px}
  .bar>i{display:block;height:100%;width:30%;background:linear-gradient(90deg,var(--accent),var(--accent2));
         animation:sl 1.1s infinite linear}
  @keyframes sl{0%{margin-left:-30%}100%{margin-left:100%}}
  details summary{cursor:pointer;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>声音工坊</h1>
  <span class="sub">GPT-SoVITS 本地语音克隆</span>
  <span id="engine" class="pill">模型未就绪</span>
</header>

<div class="wrap">
  <!-- 左栏 -->
  <div>
    <div class="card">
      <h2>① 参考音色</h2>
      <select id="refSel"></select>
      <div class="muted" id="refInfo" style="margin-top:6px"></div>
      <audio id="refAudio" controls style="display:none"></audio>
      <label>这段音频的文字（越准越稳）</label>
      <textarea id="refText" style="min-height:60px" placeholder="参考音频对应的逐字文字"></textarea>
      <div class="row" style="margin-top:8px">
        <button onclick="saveRefText()">保存文字</button>
        <button onclick="deleteRef()">删除音色</button>
      </div>
      <details style="margin-top:12px">
        <summary>＋ 上传新音色（wav / mp3 / m4a，3~10 秒干净人声）</summary>
        <label>音频文件</label>
        <input type="file" id="upFile" accept="audio/*">
        <label>名字（可留空）</label>
        <input type="text" id="upName" placeholder="例如 我的声音">
        <label>这段音频的文字</label>
        <input type="text" id="upText" placeholder="逐字文字">
        <button class="primary" style="margin-top:10px" onclick="uploadRef()">上传并设为当前音色</button>
      </details>
    </div>

    <div class="card">
      <h2>② 音色权重</h2>
      <label>GPT 权重（.ckpt）</label>
      <select id="gptSel"></select>
      <label>SoVITS 权重（.pth）</label>
      <select id="sovitsSel"></select>
      <div class="muted" style="margin-top:6px">换权重后第一次合成会慢几秒（要重新加载）</div>
    </div>

    <div class="card">
      <h2>③ 合成参数</h2>
      <label>参数风格</label>
      <select id="variantSel"></select>
      <label>语速 <span id="spdVal" class="muted">1.00</span></label>
      <input type="range" id="speed" min="0.8" max="1.2" step="0.01" value="1">
      <label>长句切分</label>
      <select id="cutSel">
        <option>按标点符号切</option>
        <option>按中文句号。切</option>
        <option>凑四句一切</option>
        <option>凑50字一切</option>
        <option>不切</option>
      </select>
    </div>

    <div class="card">
      <h2>路径</h2>
      <div class="muted" id="paths"></div>
    </div>
  </div>

  <!-- 右栏 -->
  <div>
    <div class="card">
      <h2>台词</h2>
      <textarea id="text" placeholder="在这里输入要合成的内容，例如：&#10;老牧师的许英博不要玩原神了"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="primary" id="goBtn" onclick="synthesize()">开始合成</button>
        <button onclick="document.getElementById('text').value=''">清空</button>
        <span class="muted" id="charCount"></span>
      </div>
      <div id="status" class="status"></div>
      <div id="progress" class="bar" style="display:none"><i></i></div>
      <div id="log" class="log" style="display:none;margin-top:10px"></div>
    </div>

    <div class="card">
      <h2>最新结果</h2>
      <div id="latest" class="muted">还没有合成结果</div>
    </div>

    <div class="card">
      <h2>输出音频（<span id="outCount">0</span>）</h2>
      <div id="outputs" class="muted">暂无</div>
    </div>

    <div class="card">
      <h2>引擎日志</h2>
      <div id="enginelog" class="log"></div>
      <button class="tiny" style="margin-top:8px" onclick="loadState()">刷新状态</button>
    </div>
  </div>
</div>

<script>
let STATE = null, pollTimer = null;

function fmtSize(b){ return b>1048576 ? (b/1048576).toFixed(1)+' MB' : Math.round(b/1024)+' KB'; }
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function loadState(){
  const r = await fetch('/api/state'); STATE = await r.json();
  const refSel = document.getElementById('refSel');
  refSel.innerHTML = STATE.references.map(x =>
    `<option value="${esc(x.name)}" ${x.name===STATE.current_ref?'selected':''}>${esc(x.name)} · ${x.dur??'?'}s</option>`
  ).join('') || '<option value="">（没有参考音色，请先上传）</option>';
  refSel.onchange = onRefChange;
  showRef();

  const g = document.getElementById('gptSel'), s = document.getElementById('sovitsSel');
  g.innerHTML = STATE.gpt_weights.map(x=>`<option ${x===STATE.gpt?'selected':''}>${esc(x)}</option>`).join('');
  s.innerHTML = STATE.sovits_weights.map(x=>`<option ${x===STATE.sovits?'selected':''}>${esc(x)}</option>`).join('');
  g.onchange = s.onchange = persistSelect;
  const v = document.getElementById('variantSel');
  if(!v.options.length) v.innerHTML = STATE.variants.map(x=>`<option>${x}</option>`).join('');

  document.getElementById('paths').innerHTML =
    `仓库：${esc(STATE.repo_root)}<br>参考音色：${esc(STATE.ref_dir)}<br>输出：${esc(STATE.out_dir)}`;
  document.getElementById('enginelog').textContent = (STATE.log||[]).join('\n') || '（暂无）';
  const pill = document.getElementById('engine');
  pill.textContent = STATE.loaded ? '模型已加载 ✓' : '模型加载中…';
  pill.className = 'pill ' + (STATE.loaded ? 'ok' : 'warn');
  loadOutputs();
}

function showRef(){
  const sel = document.getElementById('refSel').value;
  const item = (STATE.references||[]).find(x=>x.name===sel);
  document.getElementById('refInfo').textContent = item ? `${item.dur??'?'} 秒 · ${fmtSize(item.size)}` : '未选择';
  document.getElementById('refText').value = item ? (item.text||'') : '';
  const a = document.getElementById('refAudio');
  if(item){ a.style.display='block'; a.src = '/media/ref/' + encodeURIComponent(item.name) + '?t=' + Date.now(); }
  else { a.style.display='none'; a.removeAttribute('src'); }
}
function onRefChange(){ fetch('/api/select',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({ref:document.getElementById('refSel').value})}); showRef(); }
function persistSelect(){ fetch('/api/select',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({gpt:document.getElementById('gptSel').value, sovits:document.getElementById('sovitsSel').value})}); }

async function saveRefText(){
  const name = document.getElementById('refSel').value;
  if(!name) return alert('先选择参考音色');
  await fetch('/api/refs/text',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name, text:document.getElementById('refText').value})});
  await loadState(); alert('已保存参考文字');
}
async function deleteRef(){
  const name = document.getElementById('refSel').value;
  if(!name || !confirm('删除音色 '+name+' ？')) return;
  await fetch('/api/refs/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
  await loadState();
}
async function uploadRef(){
  const f = document.getElementById('upFile').files[0];
  if(!f) return alert('请选择音频文件');
  const fd = new FormData();
  fd.append('file', f);
  fd.append('name', document.getElementById('upName').value);
  fd.append('text', document.getElementById('upText').value);
  const btn = event.target; btn.disabled = true; btn.textContent = '上传中…';
  try{
    const r = await fetch('/api/refs/upload',{method:'POST',body:fd});
    if(!r.ok){ alert('上传失败：'+(await r.json()).detail); }
    else { await loadState(); alert('上传成功，已设为当前音色'); }
  } finally { btn.disabled=false; btn.textContent='上传并设为当前音色'; }
}

async function synthesize(){
  const text = document.getElementById('text').value.trim();
  if(!text) return alert('请输入台词');
  if(!document.getElementById('refSel').value) return alert('请先选择或上传参考音色');
  await persistSelect();
  const body = {
    text,
    ref: document.getElementById('refSel').value,
    gpt: document.getElementById('gptSel').value,
    sovits: document.getElementById('sovitsSel').value,
    variant: document.getElementById('variantSel').value,
    speed: parseFloat(document.getElementById('speed').value),
    cut: document.getElementById('cutSel').value
  };
  const btn = document.getElementById('goBtn');
  btn.disabled = true; btn.textContent = '合成中…';
  document.getElementById('progress').style.display='block';
  document.getElementById('log').style.display='block';
  setStatus('run','已提交，排队中…');
  document.getElementById('log').textContent = '';
  const r = await fetch('/api/synth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){ setStatus('err','提交失败：'+(await r.json()).detail); finish(); return; }
  const {job_id} = await r.json();
  clearInterval(pollTimer);
  pollTimer = setInterval(()=>pollJob(job_id), 1500);
}
function setStatus(cls,msg){ const s=document.getElementById('status'); s.className='status '+cls; s.textContent=msg; }
function finish(){ document.getElementById('goBtn').disabled=false;
  document.getElementById('goBtn').textContent='开始合成';
  document.getElementById('progress').style.display='none'; }

async function pollJob(id){
  const r = await fetch('/api/job/'+id); const j = await r.json();
  document.getElementById('log').textContent = (j.log||[]).join('\n');
  document.getElementById('log').scrollTop = 1e6;
  if(j.status==='done'){
    clearInterval(pollTimer); finish();
    setStatus('done','合成完成 ✓');
    const f = j.files[0];
    document.getElementById('latest').innerHTML =
      `<div class="file"><span class="nm">${esc(f)}</span>
        <a class="tag" href="/media/out/${encodeURIComponent(f)}" download>下载</a></div>
       <audio controls autoplay src="/media/out/${encodeURIComponent(f)}?t=${Date.now()}"></audio>`;
    loadOutputs();
  } else if(j.status==='error'){
    clearInterval(pollTimer); finish();
    setStatus('err','合成失败：'+j.error);
  } else if(j.status==='running'){
    setStatus('run','正在合成…（CPU 推理，短句约 5~20 秒）');
  }
}

async function loadOutputs(){
  const {outputs} = await (await fetch('/api/outputs')).json();
  document.getElementById('outCount').textContent = outputs.length;
  const box = document.getElementById('outputs');
  box.innerHTML = outputs.length ? outputs.map(o=>
    `<div class="file">
       <span class="nm">${esc(o.name)}</span>
       <span class="tag">${o.dur??'?'}s</span>
       <span class="tag">${o.mtime}</span>
       <a class="tag" href="/media/out/${encodeURIComponent(o.name)}" download>下载</a>
       <button class="tiny" onclick="delOut('${esc(o.name)}')">删</button>
     </div>
     <audio controls preload="none" src="/media/out/${encodeURIComponent(o.name)}"></audio>`).join('')
    : '暂无';
}
async function delOut(name){
  if(!confirm('删除 '+name+' ？')) return;
  await fetch('/api/outputs/'+encodeURIComponent(name),{method:'DELETE'});
  loadOutputs();
}

document.getElementById('speed').addEventListener('input', e=>{
  document.getElementById('spdVal').textContent = parseFloat(e.target.value).toFixed(2);
});
document.getElementById('text').addEventListener('input', e=>{
  document.getElementById('charCount').textContent = e.target.value.length + ' 字';
});
loadState();
setInterval(()=>{ const p=document.getElementById('engine');
  if(STATE && !STATE.loaded){ fetch('/api/state').then(r=>r.json()).then(s=>{
    if(s.loaded){ STATE=s; p.textContent='模型已加载 ✓'; p.className='pill ok';
      document.getElementById('enginelog').textContent=(s.log||[]).join('\n'); } }); } }, 3000);
</script>
</body>
</html>
